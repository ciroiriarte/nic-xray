name: CI

on:
  push:
    branches: [main]
    paths:
      - '**.sh'
      - tests/**
      - Makefile
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - '**.sh'
      - tests/**
      - Makefile
      - .github/workflows/ci.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so a new shellcheck release cannot break CI unannounced; bump both together
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  shellcheck:
    name: make lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          set -euo pipefail
          TARBALL="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$TARBALL" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${TARBALL}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$TARBALL" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP"
          echo "SHELLCHECK=$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" >> "$GITHUB_ENV"

      - name: make lint
        run: |
          "$SHELLCHECK" --version
          make lint SHELLCHECK="$SHELLCHECK"

  test:
    name: make test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: make test
        run: |
          bash --version | head -1
          make test

  # nic-report.py supports Python 3.9+: run its tests on the oldest supported version
  test-python39:
    name: nic-report tests (Python 3.9)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python --version
          python -m unittest discover -v -s tests -p 'test_nic_report.py'

  # The scripts support Bash 4.4 (SLES 15 ships it); run the suite there too, with GNU tools
  test-bash44:
    name: make test (Bash 4.4, SLES 15)
    runs-on: ubuntu-latest
    container: registry.suse.com/bci/bci-base:15.7
    steps:
      # actions/checkout needs tar and gzip; make, timeout(1) and python3 (JSON validity) are used
      # by the suite; jq is required by nic-sweep.sh
      - name: Install test prerequisites
        run: zypper --non-interactive install --no-recommends tar gzip make coreutils util-linux python3 jq

      - name: Checkout
        uses: actions/checkout@v4

      - name: make test
        shell: bash
        run: |
          bash --version | head -1
          [[ "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" == "4.4" ]] || { echo "expected Bash 4.4, got $BASH_VERSION" >&2; exit 1; }
          make test
